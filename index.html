<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הלוז של יהלי">
<meta name="theme-color" content="#eaf6ff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>הַלּוּז שֶׁל יַהֲלִי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6ff;--card:#fff;--ink:#1e2a3a;--mute:#5b6b7d;--line:#d3e3f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202e;--card:#1d2f43;--ink:#f1f6fb;--mute:#a7b8ca;--line:#2f4660}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',Arial,Tahoma,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;margin:6px 0 14px;font-weight:500}
b{font-weight:800}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
.day{border:3px solid transparent;border-radius:16px;background:var(--card);padding:6px 0 4px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.day .num{font-size:30px;font-weight:500;line-height:1.1}
.day .nm{font-size:13px;font-weight:500}
.day[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.day.today:not([aria-pressed="true"]){border-color:var(--c)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h2{margin:0;font-size:26px;font-weight:500}
.tag{font-size:16px;background:var(--c);color:#fff;border-radius:99px;padding:2px 14px;font-weight:500}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px;border-inline-start:10px solid var(--c);cursor:pointer}
.it .big{font-size:48px;line-height:1;width:60px;text-align:center}
.it .tx{font-size:24px;font-weight:500}
.done{opacity:.45}
:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>הַלּוּז שֶׁל <b>יַהֲלִי</b></h1>
  <div class="days" id="days"></div>
  <div class="head"><h2 id="dn"></h2><span class="tag" id="tg" hidden>הַיּוֹם!</span></div>
  <div class="list" id="list"></div>
</div>
<script>
var COLORS=['#d94f4f','#c9740a','#1f9d62','#2379c2','#7a52c7','#d1447f'];
var NAMES=['רִאשׁוֹן','שֵׁנִי','שְׁלִישִׁי','רְבִיעִי','חֲמִישִׁי','שִׁשִּׁי'];
var DATA=[
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)']],
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📖','<b>עִנְבָּל</b> (שִׁעוּר פְּרָטִי)',1]],
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)'],['🏠','<b>אוֹרְטָל</b> (בְּחוֹפֶשׁ)']],
 [['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)'],['🌻','<b>שַׁחַר</b> (בַּחַמָּנִיָּה)'],['🙋🏻‍♀️','<b>טוֹהַר</b> (בַּת שֵׁרוּת)']],
 [['🙋🏻‍♀️','<b>טוֹהַר</b> (בַּת שֵׁרוּת)']],
 [['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)']]
];
var now=new Date(),todayIdx=now.getDay()<=5?now.getDay():-1;
var sel=todayIdx<0?0:todayIdx,done={};
function biweekEvery(){
  var sun=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay());
  var w=Math.round((sun-new Date(2026,10,29))/604800000);
  return w>=0&&w%2===0;
}
function $(i){return document.getElementById(i)}
function render(){
  var h='';
  for(var i=0;i<6;i++)h+='<button class="day'+(i===todayIdx?' today':'')+'" style="--c:'+COLORS[i]+'" aria-pressed="'+(i===sel)+'" data-i="'+i+'"><span class="nm">'+NAMES[i]+'</span><span class="num">'+(i+1)+'</span></button>';
  $('days').innerHTML=h;
  document.querySelector('.wrap').style.setProperty('--c',COLORS[sel]);
  $('dn').textContent='יוֹם '+NAMES[sel];
  $('tg').hidden=sel!==todayIdx;
  var on=biweekEvery(),l='';
  DATA[sel].forEach(function(it,j){
    if(it[2]&&!on)return;
    var k=sel+'-'+j;
    l+='<div class="it'+(done[k]?' done':'')+'" data-k="'+k+'"><div class="big">'+it[0]+'</div><div class="tx">'+it[1]+(done[k]?' ✅':'')+'</div></div>';
  });
  $('list').innerHTML=l;
}
$('days').addEventListener('click',function(e){var b=e.target.closest('.day');if(b){sel=+b.dataset.i;render()}});
$('list').addEventListener('click',function(e){var t=e.target.closest('.it');if(t){done[t.dataset.k]=!done[t.dataset.k];render()}});
render();
</script>
</body>
</html>
