<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הלוז של יהלי">
<meta name="theme-color" content="#eaf6ff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>הַשָּׁבוּעַ שֶׁל יַהֲלִי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf6ff;--card:#fff;--ink:#1e2a3a;--mute:#5b6b7d;--line:#d3e3f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202e;--card:#1d2f43;--ink:#f1f6fb;--mute:#a7b8ca;--line:#2f4660}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',Arial,Tahoma,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:28px;margin:0;font-weight:500}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
b{font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day{min-width:0;border:3px solid var(--c);border-radius:14px;background:var(--card);color:var(--t);padding:6px 0 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.day .num{font-size:28px;font-weight:500;line-height:1.1}
.day .nm{font-size:clamp(10px,3vw,13px);font-weight:500;white-space:nowrap}
.day[aria-pressed="true"]{background:var(--c);color:var(--s)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head h2{margin:0;font-size:26px;font-weight:500}
.tag{font:inherit;font-size:16px;font-weight:500;background:var(--card);color:#40afff;border:3px solid #40afff;border-radius:99px;padding:0 14px;cursor:pointer}
.tag.on{background:#40afff;color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px;border-inline-start:10px solid var(--c);cursor:pointer}
.it .big{font-size:48px;line-height:1;min-width:60px;text-align:center;white-space:nowrap}
.it .big.two{font-size:38px}
.it .tx{font-size:24px;font-weight:500}
.past .tx{color:#959595}
.done{opacity:.45}
:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><h1>הַשָּׁבוּעַ שֶׁל <b>יַהֲלִי</b></h1><button class="tag" id="tg" hidden>הַיּוֹם!</button></div>
  <div class="days" id="days"></div>
  <div class="head"><h2 id="dn"></h2></div>
  <div class="list" id="list"></div>
</div>
<script>
var NAMES=['רִאשׁוֹן','שֵׁנִי','שְׁלִישִׁי','רְבִיעִי','חֲמִישִׁי','שִׁשִּׁי','שַׁבָּת'];
var SPORT=['👟','<b>סְפּוֹרְט</b>'];
var DATA=[
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)']],
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📖','<b>עִנְבָּל</b> (שִׁעוּר פְּרָטִי)',1],SPORT],
 [['🤝','<b>צִיּוֹנָה</b> (סַיַּעַת)'],['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)'],['🏠','<b>אוֹרְטָל</b> (בְּחוֹפֶשׁ)'],SPORT],
 [['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)'],['🌻','<b>שַׁחַר</b> (בַּחַמָּנִיָּה)'],['🙋🏻‍♀️','<b>טוֹהַר</b> (בַּת שֵׁרוּת)']],
 [['🙋🏻‍♀️','<b>טוֹהַר</b> (בַּת שֵׁרוּת)']],
 [['📚','<b>אֶפְרַת</b> (פְּרָטָנִי)']],
 [['😃🏡','<b>שַׁבָּת</b>']]
];
var COL={past:'#959595',today:'#40afff',future:'#b8e1ff'};
var TXT={past:'#959595',today:'#40afff',future:'#b8e1ff'},SEL={past:'#fff',today:'#fff',future:'#1e2a3a'};
function ctx(){
  var n=new Date(),d=n.getDay(),late=d===6&&n.getHours()*60+n.getMinutes()>=1110;
  var ref=late?new Date(n.getFullYear(),n.getMonth(),n.getDate()+1):n;
  var sun=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()-ref.getDay());
  var w=Math.round((sun-new Date(2026,10,29))/604800000);
  var t=late?-1:d;
  return{today:t,inbal:w>=0&&w%2===0,key:sun.getTime()+'-'+t};
}
function st(i,t){return t<0||i>t?'future':(i<t?'past':'today')}
var C=ctx(),last=C.key,sel=C.today<0?0:C.today,done={};
function $(i){return document.getElementById(i)}
function render(){
  var h='';
  for(var i=0;i<7;i++){var q=st(i,C.today);h+='<button class="day" style="--c:'+COL[q]+';--t:'+TXT[q]+';--s:'+SEL[q]+'" aria-pressed="'+(i===sel)+'" data-i="'+i+'"><span class="nm">'+NAMES[i]+'</span><span class="num">'+(i+1)+'</span></button>';}
  $('days').innerHTML=h;
  var s=st(sel,C.today),w=$('wrap');
  w.style.setProperty('--c',COL[s]);
  w.className='wrap'+(s==='past'?' past':'');
  $('dn').textContent='יוֹם '+NAMES[sel];
  var tg=$('tg');tg.hidden=C.today<0;tg.className='tag'+(sel===C.today?' on':'');
  var l='';
  DATA[sel].forEach(function(it,j){
    if(it[2]&&!C.inbal)return;
    var k=sel+'-'+j;
    l+='<div class="it'+(done[k]?' done':'')+'" data-k="'+k+'"><div class="big'+(it[0].length>5?' two':'')+'">'+it[0]+'</div><div class="tx">'+it[1]+(done[k]?' ✅':'')+'</div></div>';
  });
  $('list').innerHTML=l;
}
function tick(){
  var n=ctx();
  if(n.key!==last){last=n.key;C=n;done={};sel=C.today<0?0:C.today;render()}
}
$('days').addEventListener('click',function(e){var b=e.target.closest('.day');if(b){sel=+b.dataset.i;render()}});
$('list').addEventListener('click',function(e){var t=e.target.closest('.it');if(t){done[t.dataset.k]=!done[t.dataset.k];render()}});
$('tg').addEventListener('click',function(){if(C.today>=0){sel=C.today;render()}});
setInterval(tick,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
render();
</script>
</body>
</html>
